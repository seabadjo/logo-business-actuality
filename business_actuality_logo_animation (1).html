<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Business Actuality - Animation Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple: #4F296F;
    --purple-light: #7A4FA8;
    --glow: #9B6FCB;
    --bg-1: #0A0710;
    --bg-2: #160A24;
    --white: #FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background: radial-gradient(circle at 50% 45%, var(--bg-2) 0%, var(--bg-1) 70%);
    overflow:hidden;
    font-family:'Poppins', sans-serif;
  }
  .stage{
    position:relative;
    height:100vh; width:100vw;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap: 28px;
  }

  .smoke-intro{
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    pointer-events:none;
    display:flex; align-items:center; justify-content:center;
  }
  .smoke-word{
    position:absolute;
    top:50%; left:50%;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size: clamp(13px, 1.9vw, 19px);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--purple-light);
    opacity:0;
    white-space: nowrap;
    filter: blur(0px);
    transform: translate(-50%,-50%) scale(0.6);
    animation-name: smokeOut;
    animation-timing-function: cubic-bezier(.15,.6,.35,1);
    animation-fill-mode: forwards;
  }
  @keyframes smokeOut{
    0%{
      opacity:0;
      filter: blur(0px);
      transform: translate(-50%,-50%) translate(0,0) scale(0.55) rotate(var(--rot-start));
    }
    12%{
      opacity: 0.95;
      filter: blur(0px);
    }
    70%{
      opacity: 0.55;
    }
    100%{
      opacity:0;
      filter: blur(5px);
      transform: translate(-50%,-50%) translate(var(--dx), var(--dy)) scale(1.5) rotate(var(--rot-end));
    }
  }

  /* ambient glow behind logo */
  .glow{
    position:absolute;
    width: min(60vw, 480px);
    height: min(60vw, 480px);
    border-radius:50%;
    background: radial-gradient(circle, var(--glow) 0%, rgba(79,41,111,0.25) 45%, transparent 70%);
    filter: blur(10px);
    opacity:0;
    transform: scale(0.6);
    animation: glowIn 1.6s cubic-bezier(.2,.7,.2,1) 2.45s forwards,
               breathe 3.4s ease-in-out 2.2s infinite;
  }

  .logo-wrap{
    position:relative;
    width: min(42vw, 300px);
    aspect-ratio: 1;
    opacity:0;
    transform: scale(0.35) rotate(-10deg);
    filter: blur(14px);
    animation: logoIn 1.1s cubic-bezier(.16,1.2,.3,1) 2.65s forwards;
  }

  .logo-wrap img{
    width:100%; height:100%;
    display:block;
    border-radius: 22%;
    box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03);
  }

  /* light sweep */
  .sweep{
    position:absolute;
    top:-20%; left:-60%;
    width:40%; height:140%;
    background: linear-gradient(75deg, transparent 0%, rgba(255,255,255,0.55) 50%, transparent 100%);
    transform: skewX(-18deg);
    opacity:0;
    pointer-events:none;
    border-radius: 22%;
    animation: sweepMove 1.1s ease-out 3.75s 1,
               sweepLoop 4.5s ease-out 3.4s infinite;
  }

  .wordmark{
    display:flex;
    gap: 2px;
    font-size: clamp(20px, 3.6vw, 34px);
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--white);
  }
  .wordmark span{
    display:inline-block;
    opacity:0;
    transform: translateY(14px);
    animation: letterIn 0.55s cubic-bezier(.2,.9,.25,1) forwards;
  }

  .underline{
    width: 0;
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--glow), transparent);
    animation: lineIn 0.9s cubic-bezier(.3,.8,.3,1) 4.45s forwards;
  }

  .tagline{
    font-size: clamp(11px, 1.4vw, 13px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--purple-light);
    opacity:0;
    animation: fadeUp 0.8s ease-out 4.85s forwards;
  }

  .replay{
    position:absolute;
    bottom: 28px;
    right: 28px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--white);
    font-family:'Poppins', sans-serif;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    cursor:pointer;
    letter-spacing: 0.5px;
    opacity:0;
    animation: fadeUp 0.6s ease-out 5.3s forwards;
    transition: background 0.2s ease;
  }
  .replay:hover{ background: rgba(255,255,255,0.14); }

  @keyframes glowIn{
    to{ opacity:1; transform: scale(1); }
  }
  @keyframes breathe{
    0%,100%{ transform: scale(1); opacity:0.9; }
    50%{ transform: scale(1.06); opacity:1; }
  }
  @keyframes logoIn{
    60%{ filter: blur(0px); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); filter: blur(0px); }
  }
  @keyframes sweepMove{
    0%{ opacity:0; left:-60%; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ opacity:0; left:120%; }
  }
  @keyframes sweepLoop{
    0%{ opacity:0; left:-60%; }
    10%{ opacity:0.9; }
    35%{ opacity:0; left:120%; }
    100%{ opacity:0; left:120%; }
  }
  @keyframes letterIn{
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes lineIn{
    to{ width: 220px; }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
</style>
</head>

<script>
  // --- Smoke intro: theme words rise from the center and disperse outward ---
  const themes = ["POLITIQUE","ACTUALITE","ECONOMIE","AFRIQUE","EDITORIAL","SOCIETE","SPORT","CULTURE"];
  const smokeContainer = document.getElementById('smokeIntro');

  themes.forEach((word, i) => {
    const el = document.createElement('div');
    el.className = 'smoke-word';
    el.textContent = word;

    // spread words evenly around a circle, with a little jitter, like smoke curling in different directions
    const baseAngle = (360 / themes.length) * i;
    const jitter = (Math.random() - 0.5) * 22;
    const angle = (baseAngle + jitter) * (Math.PI / 180);
    const dist = 220 + Math.random() * 160; // how far it drifts

    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist * 0.75 - 40; // slight upward bias, like smoke rising

    el.style.setProperty('--dx', dx.toFixed(1) + 'px');
    el.style.setProperty('--dy', dy.toFixed(1) + 'px');
    el.style.setProperty('--rot-start', (jitter * 0.3) + 'deg');
    el.style.setProperty('--rot-end', (jitter * 1.4) + 'deg');

    const duration = 1.7 + Math.random() * 0.5;
    const startDelay = 0.05 + i * 0.16;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = startDelay + 's';

    smokeContainer.appendChild(el);
  });

  const text = "BUSINESS ACTUALITY";
  const wordmark = document.getElementById('wordmark');

  function buildLetters(){
    wordmark.innerHTML = '';
    let delay = 3.95;
    [...text].forEach((ch) => {
      const span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00A0\u00A0' : ch;
      span.style.animationDelay = delay + 's';
      wordmark.appendChild(span);
      delay += 0.035;
    });
  }
  buildLetters();

  document.getElementById('replayBtn').addEventListener('click', () => {
    location.reload();
  });
</script>
